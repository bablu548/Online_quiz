<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- START SCREEN -->
    <div id="startScreen">

        <h1>Online Quiz System</h1>
        <p class="subtitle">Test your knowledge with online MCQs</p>

        <input type="text" id="studentName"
               placeholder="Enter your name">

        <label>Category</label>

        <select id="category">
            <option value="9">General Knowledge</option>
            <option value="18">Computer Science</option>
            <option value="17">Science</option>
            <option value="19">Mathematics</option>
            <option value="23">History</option>
            <option value="22">Geography</option>
        </select>

        <label>Difficulty</label>

        <select id="difficulty">
            <option value="">Any Difficulty</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <label>Number of Questions</label>

        <select id="amount">
            <option value="5">5 Questions</option>
            <option value="10" selected>10 Questions</option>
            <option value="15">15 Questions</option>
            <option value="20">20 Questions</option>
        </select>

        <button onclick="startQuiz()">START QUIZ</button>

    </div>


    <!-- QUIZ SCREEN -->
    <div id="quizScreen" style="display:none;">

        <div class="quizHeader">

            <span id="questionNumber"></span>

            <span class="timer">
                ⏱ <b id="timer">30</b>s
            </span>

        </div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <h2 id="question">Loading...</h2>

        <div id="options"></div>

        <div class="buttons">

            <button class="reviewBtn"
                    onclick="markReview()">
                🚩 Mark Review
            </button>

            <button onclick="saveNext()">
                💾 Save & Next
            </button>

        </div>

        <div id="reviewStatus"></div>

    </div>


    <!-- RESULT SCREEN -->
    <div id="resultScreen" style="display:none;">

        <h1>Quiz Completed!</h1>

        <div class="resultBox">

            <h2 id="resultName"></h2>

            <div class="stats">

                <div>
                    <b id="totalQuestions">0</b>
                    <span>Total</span>
                </div>

                <div class="correct">
                    <b id="correctAnswers">0</b>
                    <span>Correct</span>
                </div>

                <div class="wrong">
                    <b id="wrongAnswers">0</b>
                    <span>Wrong</span>
                </div>

                <div class="unanswered">
                    <b id="unanswered">0</b>
                    <span>Unanswered</span>
                </div>

            </div>

            <p id="resultPercentage"></p>

        </div>

        <h2>Answer Review</h2>

        <div id="answerReview"></div>

        <button onclick="location.reload()">
            🔄 TAKE QUIZ AGAIN
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
