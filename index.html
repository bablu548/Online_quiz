<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ================= START SCREEN ================= -->

    <div id="startScreen">

        <h1>Online Quiz System</h1>

        <p class="subtitle">
            Test your knowledge with online MCQ questions
        </p>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your name"
        >

        <label>Category</label>

        <select id="category">

            <option value="9">
                General Knowledge
            </option>

            <option value="18">
                Computer Science
            </option>

            <option value="17">
                Science
            </option>

            <option value="19">
                Mathematics
            </option>

            <option value="23">
                History
            </option>

            <option value="22">
                Geography
            </option>

        </select>


        <label>Difficulty</label>

        <select id="difficulty">

            <option value="">
                Any Difficulty
            </option>

            <option value="easy">
                Easy
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="hard">
                Hard
            </option>

        </select>


        <label>Number of Questions</label>

        <select id="amount">

            <option value="5">
                5 Questions
            </option>

            <option value="10" selected>
                10 Questions
            </option>

            <option value="15">
                15 Questions
            </option>

            <option value="20">
                20 Questions
            </option>

        </select>


        <button onclick="startQuiz()">
            START QUIZ
        </button>

    </div>


    <!-- ================= QUIZ SCREEN ================= -->

    <div id="quizScreen" style="display:none;">

        <div class="quizHeader">

            <span id="questionNumber">
                Question 1 / 10
            </span>

            <span class="timer">
                ⏱ <b id="timer">30</b>s
            </span>

        </div>


        <!-- Progress Bar -->

        <div class="progress">

            <div id="progressBar"></div>

        </div>


        <!-- Question Palette -->

        <div id="questionPalette">

            <h3>Questions</h3>

            <div id="questionButtons"></div>

            <div class="legend">

                <span>
                    <i class="box currentBox"></i>
                    Current
                </span>

                <span>
                    <i class="box answeredBox"></i>
                    Answered
                </span>

                <span>
                    <i class="box reviewBox"></i>
                    Review
                </span>

            </div>

        </div>


        <!-- Question -->

        <h2 id="question">
            Loading questions...
        </h2>


        <!-- Options -->

        <div id="options"></div>


        <!-- Review Status -->

        <div id="reviewStatus"></div>


        <!-- Buttons -->

        <div class="buttons">

            <button
                class="reviewBtn"
                onclick="markReview()"
            >
                🚩 Mark Review
            </button>


            <button
                class="saveBtn"
                onclick="saveNext()"
            >
                💾 Save & Next
            </button>

        </div>

    </div>


    <!-- ================= RESULT SCREEN ================= -->

    <div id="resultScreen" style="display:none;">

        <h1>Quiz Completed!</h1>


        <div class="resultBox">

            <h2 id="resultName"></h2>


            <div class="stats">

                <div class="stat total">

                    <b id="totalQuestions">
                        0
                    </b>

                    <span>
                        Total
                    </span>

                </div>


                <div class="stat correct">

                    <b id="correctAnswers">
                        0
                    </b>

                    <span>
                        Correct
                    </span>

                </div>


                <div class="stat wrong">

                    <b id="wrongAnswers">
                        0
                    </b>

                    <span>
                        Wrong
                    </span>

                </div>


                <div class="stat unanswered">

                    <b id="unanswered">
                        0
                    </b>

                    <span>
                        Unanswered
                    </span>

                </div>

            </div>


            <div class="percentage">

                <span>
                    Percentage
                </span>

                <strong id="resultPercentage">
                    0%
                </strong>

            </div>

        </div>


        <!-- Answer Review -->

        <h2 class="answerTitle">
            Answer Review
        </h2>


        <div id="answerReview"></div>


        <button onclick="location.reload()">
            🔄 TAKE QUIZ AGAIN
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
